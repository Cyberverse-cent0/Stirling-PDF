version: '3'

tasks:
  dev:
    desc: "Start the Rust backend server"
    dir: rust
    cmds:
      - cargo run

  build:
    desc: "Build the Rust backend (release)"
    dir: rust
    cmds:
      - cargo build --release
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force ../build/rust | Out-Null; Copy-Item target/release/stirling-server.exe ../build/rust/stirling-server.exe -Force"
        platforms: [windows]
      - cmd: mkdir -p ../build/rust && cp target/release/stirling-server ../build/rust/stirling-server
        platforms: [linux, darwin]

  test:
    desc: "Run Rust backend tests"
    dir: rust
    cmds:
      - cargo test

  lint:
    desc: "Lint Rust backend (clippy + fmt check)"
    dir: rust
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo fmt --all -- --check

  fix:
    desc: "Auto-fix Rust backend (clippy + fmt)"
    dir: rust
    cmds:
      - cargo clippy --all-targets --fix --allow-dirty -- -D warnings
      - cargo fmt

  clean:
    desc: "Remove Rust build artifacts"
    dir: rust
    cmds:
      - cargo clean

  check:
    desc: "Rust backend quality gate"
    cmds:
      - task: lint
      - task: test

  engine:dev:
    desc: "Start the Rust AI engine (:5001)"
    dir: rust/engine
    cmds:
      - cargo run

  engine:build:
    desc: "Build the Rust AI engine (release)"
    dir: rust/engine
    cmds:
      - cargo build --release

  engine:test:
    desc: "Run Rust AI engine tests"
    dir: rust/engine
    cmds:
      - cargo test --all-targets

  engine:lint:
    desc: "Lint Rust AI engine (clippy + fmt check)"
    dir: rust/engine
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo fmt --all -- --check

  engine:fix:
    desc: "Auto-fix Rust AI engine (clippy + fmt)"
    dir: rust/engine
    cmds:
      - cargo clippy --all-targets --fix --allow-dirty -- -D warnings
      - cargo fmt

  engine:clean:
    desc: "Remove Rust AI engine build artifacts"
    dir: rust/engine
    cmds:
      - cargo clean

  engine:parity:
    desc: "Compare Python and Rust engine responses on deterministic endpoints"
    dir: rust/engine
    cmds:
      - ./scripts/parity_check.sh

  engine:check:
    desc: "Rust AI engine quality gate"
    cmds:
      - task: engine:lint
      - task: engine:test

  cli:
    desc: "Run the stirling tooling CLI (doctor, engines, ports, test, ...)"
    dir: rust
    vars:
      CLI_ARGS: '{{.CLI_ARGS | default ""}}'
    cmds:
      - cargo run -p stirling -- {{.CLI_ARGS}}
