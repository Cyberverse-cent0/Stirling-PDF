version: '3'

# Tauri's beforeBuildCommand builds the frontend, so the desktop entrypoint
# needs the same threadpool size as the frontend build tasks.
env:
  UV_THREADPOOL_SIZE: "16"

tasks:
  prepare:
    desc: "Prepare desktop build dependencies"
    deps:
      - task: ":frontend:prepare"
        vars: { MODE: desktop }
      - provisioner
    cmds:
      - task: rust-server
      - task: engines

  engines:
    desc: "Stage tier-1 conversion engines (gs, qpdf, ...) for bundling"
    dir: src-tauri
    cmds:
      - cargo run --release --package stirling-desktop-build -- stage-engines

  provisioner:
    desc: "Build Windows installer artifacts"
    platforms: [windows]
    dir: src-tauri
    cmds:
      - cargo run --release --package stirling-desktop-build -- build-provisioner

  rust-server:
    desc: "Build stirling-server and stage it as a Tauri sidecar binary"
    dir: ..
    cmds:
      # macOS ships a universal .app: `tauri build --target
      # universal-apple-darwin` looks for a single fat
      # `stirling-server-universal-apple-darwin` sidecar, while per-arch
      # `--target` builds and `tauri dev` need the arch-suffixed names.
      # Build both arches, lipo them, and stage all three.
      - cmd: rustup target add aarch64-apple-darwin x86_64-apple-darwin
        platforms: [darwin]
      - cmd: cargo build --release --manifest-path rust/Cargo.toml --bin stirling-server --target aarch64-apple-darwin
        platforms: [darwin]
      - cmd: cargo build --release --manifest-path rust/Cargo.toml --bin stirling-server --target x86_64-apple-darwin
        platforms: [darwin]
      - cmd: mkdir -p rust/target/release && lipo -create rust/target/aarch64-apple-darwin/release/stirling-server rust/target/x86_64-apple-darwin/release/stirling-server -output rust/target/release/stirling-server-universal
        platforms: [darwin]
      - cmd: cargo run --release --manifest-path frontend/src-tauri/Cargo.toml --package stirling-desktop-build -- stage-rust-server frontend/src-tauri/binaries rust/target/aarch64-apple-darwin/release/stirling-server=aarch64-apple-darwin rust/target/x86_64-apple-darwin/release/stirling-server=x86_64-apple-darwin rust/target/release/stirling-server-universal=universal-apple-darwin
        platforms: [darwin]
      - cmd: cargo build --release --manifest-path rust/Cargo.toml --bin stirling-server
        platforms: [linux, windows]
      - cmd: cargo run --release --manifest-path frontend/src-tauri/Cargo.toml --package stirling-desktop-build -- stage-rust-server frontend/src-tauri/binaries rust/target/release/stirling-server.exe
        platforms: [windows]
      - cmd: cargo run --release --manifest-path frontend/src-tauri/Cargo.toml --package stirling-desktop-build -- stage-rust-server frontend/src-tauri/binaries rust/target/release/stirling-server
        platforms: [linux]

  dev:
    desc: "Start Tauri desktop dev mode"
    deps: [prepare]
    ignore_error: true
    cmds:
      # Dev HTTP uses the packaged app origin instead of the Vite origin; keep this out of builds.
      - npx tauri dev --no-watch --features tauri-plugin-http/unsafe-headers

  build:
    desc: "Build Tauri desktop app (production)"
    deps: [prepare]
    cmds:
      - npx tauri build

  build:dev:
    desc: "Build Tauri desktop app (dev, no bundling)"
    deps: [prepare]
    cmds:
      - npx tauri build --no-bundle

  build:dev:mac:
    desc: "Build Tauri desktop .app bundle (macOS)"
    deps: [prepare]
    cmds:
      - npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

  build:dev:windows:
    desc: "Build Tauri desktop NSIS installer (Windows)"
    deps: [prepare]
    cmds:
      - npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

  build:dev:linux:
    desc: "Build Tauri desktop AppImage (Linux)"
    deps: [prepare]
    cmds:
      - npx tauri build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

  test:
    desc: "Run Tauri/Cargo tests"
    deps: [prepare]
    dir: src-tauri
    cmds:
      - cargo test

  rust-utils:check:
    desc: "Check the standalone Rust utility library"
    dir: src-tauri/src/utils
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings
      - cargo test

  # ============================================================
  # Lint, format, test
  # ============================================================

  lint:
    desc: "Run linting"
    cmds:
      - task: lint:app
      - task: lint:build-tools
      - task: lint:provisioner
      - task: lint:thumbnail-handler

  lint:app:
    desc: "Lint the Tauri app crate"
    dir: src-tauri
    env:
      # Clippy only needs the crate graph. Blanking the bundle resources stops
      # tauri-build failing on the engines glob that only `desktop:prepare`
      # produces, so linting does not need an engine staging run.
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  lint:provisioner:
    desc: "Lint the installer provisioner crate"
    dir: src-tauri/provisioner
    cmds:
      - cargo clippy --all-targets -- -D warnings

  lint:build-tools:
    desc: "Lint desktop build tools"
    dir: src-tauri
    cmds:
      - cargo clippy --package stirling-desktop-build --all-targets -- -D warnings

  lint:thumbnail-handler:
    desc: "Lint the Windows thumbnail handler crate"
    platforms: [windows]
    dir: src-tauri/thumbnail-handler
    cmds:
      - cargo clippy --all-targets -- -D warnings

  format:
    desc: "Auto-fix Rust formatting (not implemented yet)"
    cmds: []

  format:check:
    desc: "Check Rust formatting (not implemented yet)"
    cmds: []

  check:
    desc: "Full desktop quality gate"
    cmds:
      - task: rust-utils:check
      - task: ":frontend:typecheck:desktop"
      - task: lint
      - task: test:build-tools
      - task: format:check
      - task: test

  test:build-tools:
    desc: "Test desktop build tools"
    dir: src-tauri
    cmds:
      - cargo test --package stirling-desktop-build

  clean:
    desc: "Clean Tauri/Cargo build artifacts"
    cmds:
      - cd src-tauri && cargo clean
      - rm -rf dist build libs runtime src-tauri/engines src-tauri/binaries/engines
