[package]
name = "stirling"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform development and operations CLI for Stirling PDF"

[[bin]]
name = "stirling"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "blocking",
    "json",
    "multipart",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
