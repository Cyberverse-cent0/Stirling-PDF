[package]
name = "stirling-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust backend for Stirling PDF (strangler migration alongside the Java/Spring backend)"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
stirling-macros = { path = "macros" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart"] }
http-body-util = "0.1"
futures-util = "0.3"
bytes = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = "0.47.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
